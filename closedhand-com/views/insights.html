<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <script src="/theme.js"></script>
  <meta name="referrer" content="no-referrer">
  <meta name="robots" content="noindex">
  <title>Insights</title>
  <link rel="icon" href="/favicon.png" type="image/png" sizes="192x192">
  <link rel="icon" href="/favicon.svg" type="image/svg+xml">
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600&family=Fraunces:opsz,wght,SOFT@9..144,500,30&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/interface.css">
  <link rel="stylesheet" href="/site.css">
  <link rel="stylesheet" href="/insights.css">
</head>
<body>
  <header class="site-head">
    <a class="ch-brand" href="/"><img src="/fist.png" alt=""><span>Closedhand</span></a>
  </header>
  <main class="site-main insights-main">
    <h1 class="title">Insights</h1>
    <p class="lede" id="updated">Only you can open this page.</p>
    <div class="tiles" id="tiles"></div>
    <section class="card ins-card">
      <h2>From download to daily use</h2>
      <p class="ins-note">How many make it to each step.</p>
      <div class="funnel" id="funnel"></div>
    </section>
    <section class="card ins-card">
      <h2>Each week</h2>
      <ul class="key" id="weeks-key"></ul>
      <div class="chart" id="weeks" role="img"></div>
    </section>
    <section class="card ins-card">
      <h2>Personal URLs</h2>
      <p class="ins-note" id="grid-note"></p>
      <div class="grid" id="grid" role="img"></div>
      <ul class="key" id="grid-key"></ul>
      <div class="meter" id="dns"></div>
    </section>
    <div class="tiles tiles-small" id="more"></div>
    <section class="card ins-card"><h2 id="everyone-title">Everyone</h2>
      <label class="people-search"><span>Search</span><input id="search" type="search" placeholder="Email or personal URL" autocomplete="off" spellcheck="false"></label>
      <ol class="people" id="people-list"></ol>
    </section>
    <section class="card ins-card"><h2 id="reports-title">Bug reports</h2><ol class="people" id="reports"></ol></section>
    <p class="status" id="status" role="status" aria-live="polite">Loading…</p>
  </main>
  <script src="/insights.js" defer></script>
</body>
</html>
