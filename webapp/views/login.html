<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, viewport-fit=cover">
  <title>Log in | Closedhand</title>
  <link rel="icon" href="/favicon.svg" type="image/svg+xml">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@300;400;500;600&family=Fraunces:ital,opsz,wght,SOFT@0,9..144,300..900,0..100;1,9..144,300..900,0..100&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/interface.css">
  <style>
    :root {
      --text-primary: rgba(239,230,214,0.92);
      --text-secondary: rgba(239,230,214,0.65);
      --text-tertiary: rgba(239,230,214,0.4);
      --bg-raised: rgba(26,24,23,0.55);
      --bg-input: #1A1817;
      --border-default: rgba(239,230,214,0.1);
      --border-faint: rgba(239,230,214,0.06);
      --accent: #D8624B;
      --accent-dim: rgba(208,86,63,0.15);
      --warn: #D0A652;
    }
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      background: #100E0D; color: var(--text-primary);
      font-family: 'IBM Plex Sans', system-ui, sans-serif; font-size: 15px;
      min-height: 100vh; display: flex; align-items: center; justify-content: center;
      -webkit-font-smoothing: antialiased;
    }
    body::before {
      content: ""; position: fixed; inset: 0;
      background: radial-gradient(560px 380px at 30% 10%, rgba(208,86,63,0.06), transparent 70%);
      pointer-events: none;
    }
    .box { width: min(360px, 90vw); position: relative; }
    /* The same fist and wordmark as every other page (interface.css). */
    .box > .ch-brand { display: flex; justify-content: center; margin-bottom: 26px; }
    .card {
      background: var(--bg-raised); border: 1px solid var(--border-faint); border-radius: 16px;
      padding: 26px; backdrop-filter: blur(6px);
    }
    label { display: block; font-size: 13px; color: var(--text-secondary); margin-bottom: 8px; }
    input[type="password"], input.code {
      width: 100%; padding: 11px 14px; background: var(--bg-input);
      border: 1px solid var(--border-default); border-radius: 10px;
      color: var(--text-primary); font-family: inherit; font-size: 15px; outline: none;
      transition: border-color 0.15s ease;
    }
    input[type="password"]:focus, input.code:focus { border-color: var(--accent-dim); }
    input.code { letter-spacing: 0.3em; font-variant-numeric: tabular-nums; }
    .sent { font-size: 13.5px; color: var(--text-secondary); line-height: 1.5; margin-bottom: 14px; }
    .again { display: block; margin-top: 12px; font-size: 13px; color: var(--text-tertiary); background: none; border: none; padding: 0; width: auto; cursor: pointer; text-decoration: underline; }
    .again:hover { transform: none; color: var(--text-secondary); }
    button {
      width: 100%; margin-top: 14px; padding: 11px; border: none; border-radius: 10px;
      background: var(--accent); color: #100E0D; font-family: inherit; font-size: 14.5px;
      font-weight: 600; cursor: pointer; transition: transform 0.15s ease;
    }
    button:hover { transform: translateY(-1px); }
    .err { display: none; margin-top: 12px; font-size: 13px; color: var(--warn); }
    .hint { margin-top: 16px; font-size: 12.5px; color: var(--text-tertiary); text-align: center; }
  </style>
  <link rel="manifest" href="/manifest.webmanifest">
  <link rel="apple-touch-icon" href="/logocircle.png">
  <meta name="theme-color" content="#100E0D">
</head>
<body>
  <div class="box">
    <span class="ch-brand"><img src="/fist.png" alt=""><span>Closedhand</span></span>
    <form class="card" id="login-form" method="post">
      <label for="pw">Dashboard password</label>
      <input type="password" id="pw" autocomplete="current-password" autofocus>
      <button type="submit">Log in</button>
      <p class="err" id="err"></p>
    </form>
    <!-- Through the personal URL: the second step, the code sent to a chat app. -->
    <form class="card" id="code-form" method="post" hidden>
      <p class="sent" id="sent"></p>
      <label for="code">Sign-in code</label>
      <input class="code" type="text" id="code" inputmode="numeric" autocomplete="one-time-code" maxlength="6" pattern="[0-9]{6}">
      <button type="submit">Log in</button>
      <p class="err" id="code-err"></p>
      <button type="button" class="again" id="again">Start again</button>
    </form>
    <p class="hint" id="hint">The password you chose during setup.</p>
  </div>
<script>
(function () {
  "use strict";
  var form = document.getElementById("login-form");
  var err = document.getElementById("err");
  var codeForm = document.getElementById("code-form");
  var codeErr = document.getElementById("code-err");
  var hint = document.getElementById("hint");
  function post(url, body) {
    return fetch(url, { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify(body) })
      .then(function (res) { return res.json().catch(function () { return {}; }).then(function (j) { return { ok: res.ok, j: j }; }); });
  }
  function show(el, text) { el.textContent = text; el.style.display = "block"; }
  function signedIn() {
    var next = new URLSearchParams(location.search).get("next") || "/";
    // The server cannot see #agents; browsers carry it onto the login URL.
    // Restore it after signing in, while keeping redirects on this origin.
    var destination = new URL(next, location.origin);
    if (!next.startsWith("/") || destination.origin !== location.origin) destination = new URL("/", location.origin);
    if (!destination.hash) destination.hash = location.hash;
    location.href = destination.pathname + destination.search + destination.hash;
  }
  function askForPassword(message) {
    codeForm.hidden = true; form.hidden = false; hint.hidden = false;
    document.getElementById("pw").value = "";
    if (message) show(err, message);
    document.getElementById("pw").focus();
  }
  // Names where the code went: "your Telegram and your WhatsApp".
  function askForCode(sentTo) {
    document.getElementById("sent").textContent = "Closedhand sent a 6-digit code to " + sentTo.join(" and ") + ". It works for 10 minutes.";
    form.hidden = true; hint.hidden = true; codeForm.hidden = false;
    codeErr.style.display = "none";
    document.getElementById("code").value = "";
    document.getElementById("code").focus();
  }
  form.addEventListener("submit", function (ev) {
    ev.preventDefault();
    err.style.display = "none";
    post("/api/login", { password: document.getElementById("pw").value })
      .then(function (r) {
        if (r.ok && r.j.needsCode) askForCode(r.j.sentTo || ["your chat app"]);
        else if (r.ok) signedIn();
        else show(err, r.j.error || "Wrong password");
      })
      .catch(function () { show(err, "Could not reach the server"); });
  });
  codeForm.addEventListener("submit", function (ev) {
    ev.preventDefault();
    codeErr.style.display = "none";
    post("/api/login/code", { code: document.getElementById("code").value })
      .then(function (r) {
        if (r.ok) signedIn();
        else if (r.j.restart) askForPassword(r.j.error);
        else show(codeErr, r.j.error || "That code isn't right.");
      })
      .catch(function () { show(codeErr, "Could not reach the server"); });
  });
  document.getElementById("again").addEventListener("click", function () { askForPassword(""); });
})();
</script>
</body>
</html>
