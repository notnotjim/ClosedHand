<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, viewport-fit=cover">
  <script src="/theme.js"></script>
  <title>Setup code | Closedhand</title>
  <link rel="icon" href="/favicon.svg" type="image/svg+xml">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@300;400;500;600&family=Fraunces:ital,opsz,wght,SOFT@0,9..144,300..900,0..100;1,9..144,300..900,0..100&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/interface.css">
  <style>
    :root {
      --text-primary: rgba(var(--fg-rgb),0.92);
      --text-secondary: rgba(var(--fg-rgb),0.65);
      --text-tertiary: rgba(var(--fg-rgb),0.4);
      --bg-raised: rgba(var(--raised-rgb),0.55);
      --bg-input: var(--raised);
      --border-default: rgba(var(--fg-rgb),0.1);
      --border-faint: rgba(var(--fg-rgb),0.06);
      --accent-dim: rgba(var(--accent-strong-rgb),0.15);
    }
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      background: var(--bg); color: var(--text-primary);
      font-family: 'IBM Plex Sans', system-ui, sans-serif; font-size: 15px;
      min-height: 100vh; display: flex; align-items: center; justify-content: center;
      -webkit-font-smoothing: antialiased;
    }
    body::before {
      content: ""; position: fixed; inset: 0;
      background: radial-gradient(560px 380px at 30% 10%, rgba(var(--accent-strong-rgb),0.06), transparent 70%);
      pointer-events: none;
    }
    .box { width: min(360px, 90vw); position: relative; }
    /* The same fist and wordmark as every other page (interface.css). */
    .box > .ch-brand { display: flex; justify-content: center; margin-bottom: 26px; }
    .card {
      background: var(--bg-raised); border: 1px solid var(--border-faint); border-radius: 16px;
      padding: 26px; backdrop-filter: blur(6px);
    }
    label { display: block; font-size: 13px; color: var(--text-secondary); margin-bottom: 8px; }
    input[type="password"], input.code {
      width: 100%; padding: 11px 14px; background: var(--bg-input);
      border: 1px solid var(--border-default); border-radius: 10px;
      color: var(--text-primary); font-family: inherit; font-size: 15px; outline: none;
      transition: border-color 0.15s ease;
    }
    input[type="password"]:focus, input.code:focus { border-color: var(--accent-dim); }
    /* The second step looks like one: a heading that says where the code
       went, and a larger code field, so the change of screen is seen. */
    input.code { font-size: 26px; text-align: center; letter-spacing: 0.4em; padding: 12px 14px 12px calc(14px + 0.4em); font-variant-numeric: tabular-nums; }
    input.code::placeholder { letter-spacing: 0.4em; color: var(--text-tertiary); }
    .step-title { font-family: 'Fraunces', Georgia, serif; font-size: 22px; font-weight: 500; line-height: 1.25; margin-bottom: 8px; color: var(--text-primary); }
    .sent { font-size: 13.5px; color: var(--text-secondary); line-height: 1.5; margin-bottom: 18px; }
    #code-form:not([hidden]) { animation: step-in 0.25s ease-out; }
    @keyframes step-in { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: none; } }
    @media (prefers-reduced-motion: reduce) { #code-form:not([hidden]) { animation: none; } }
    .again { display: block; margin-top: 12px; font-family: inherit; font-size: 13px; color: var(--text-tertiary); background: none; border: none; padding: 0; width: auto; cursor: pointer; text-decoration: underline; }
    .again:hover { color: var(--text-secondary); }
    /* The main action is the shared ink button (interface.css .cta). */
    button.cta { margin-top: 18px; }
    .err { display: none; margin-top: 12px; font-size: 13px; color: var(--warn); }
    .hint { margin-top: 16px; font-size: 12.5px; color: var(--text-tertiary); text-align: center; }
      .lede { font-size: 13.5px; color: var(--text-secondary); line-height: 1.55; margin-bottom: 18px; }
    input.setup { width: 100%; padding: 11px 14px; background: var(--bg-input); border: 1px solid var(--border-default); border-radius: 10px;
      color: var(--text-primary); font: 500 16px/1.2 ui-monospace, SFMono-Regular, Menlo, monospace; letter-spacing: 0.06em; outline: none; transition: border-color 0.15s ease; }
    input.setup:focus { border-color: var(--accent-dim); }
  </style>
  <meta name="theme-color" content="#100E0D">
  <meta name="robots" content="noindex">
</head>
<body>
  <div class="box">
    <span class="ch-brand"><img src="/fist.png" alt=""><span>Closedhand</span></span>
    <form class="card" id="form" method="post">
      <h1 class="step-title">Type your setup code</h1>
      <p class="lede">This Closedhand isn't set up yet. To show it's yours, type the setup code from where you created it. <span data-railway="On Railway it's in your project, under the webapp service's Variables, as SETUP_CODE.">It's saved there as SETUP_CODE.</span></p>
      <label for="code">Setup code</label>
      <input class="setup" type="text" id="code" autocomplete="off" autocapitalize="characters" spellcheck="false" autofocus required>
      <button type="submit" class="cta">Continue</button>
      <p class="err" id="err"></p>
    </form>
  </div>
<script>
(function () {
  "use strict";
  var form = document.getElementById("form"), err = document.getElementById("err"), button = form.querySelector("button");
  form.addEventListener("submit", function (e) {
    e.preventDefault();
    err.style.display = "none";
    button.disabled = true;
    fetch("/api/setup-code", { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify({ code: document.getElementById("code").value }) })
      .then(function (res) { return res.json().catch(function () { return {}; }).then(function (j) { return { ok: res.ok, j: j }; }); })
      .then(function (r) {
        if (r.ok) { location.href = r.j.next || "/setup"; return; }
        err.textContent = r.j.error || "Something went wrong. Try again."; err.style.display = "block"; button.disabled = false;
      })
      .catch(function () { err.textContent = "Could not reach Closedhand. Try again."; err.style.display = "block"; button.disabled = false; });
  });
})();
</script>
</body>
</html>
