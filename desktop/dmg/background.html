<!doctype html><html><head><meta charset="utf-8">
<!-- The DMG window background. Rendered to background.png (640x400) and
     background@2x.png (1280x800) by screenshotting .bg in a browser at device
     scale 1 and 2. Icons sit where settings.py puts them: (170, 230) and (470, 230). -->
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500&family=Fraunces:opsz,wght,SOFT@9..144,500,30&display=block" rel="stylesheet">
<style>
  html, body { margin: 0; }
  /* 640 x 400 points: the window. Icons sit at (170, 230) and (470, 230), 96 points. */
  .bg { position: relative; width: 640px; height: 400px; background: #EFE6D6; overflow: hidden; font-family: 'IBM Plex Sans', sans-serif; color: #100E0D; }
  .brand { position: absolute; top: 46px; left: 0; right: 0; display: flex; justify-content: center; align-items: center; gap: 10px; }
  .brand img { width: 30px; height: 33px; }
  .brand span { font: 500 28px/1 'Fraunces', serif; font-variation-settings: 'opsz' 48, 'SOFT' 30; letter-spacing: -0.02em; }
  .tagline { position: absolute; top: 92px; left: 0; right: 0; text-align: center; font-size: 15px; color: #5A5249; }
  .arrow { position: absolute; left: 252px; top: 214px; width: 136px; height: 32px; }
  .hint { position: absolute; top: 340px; left: 0; right: 0; text-align: center; font-size: 12.5px; color: #7A7268; }
</style></head><body>
<div class="bg">
  <div class="brand"><img src="fist-dark.png" alt=""><span>ClosedHand</span></div>
  <div class="tagline">A personal AI assistant you actually own</div>
  <svg class="arrow" viewBox="0 0 136 32" aria-hidden="true"><path d="M4 16 H126 M114 6 L127 16 L114 26" fill="none" stroke="#D0563F" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/></svg>
  <div class="hint">Drag ClosedHand to Applications</div>
</div></body></html>
