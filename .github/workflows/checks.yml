name: Checks

# Cheap, dependency-free guards that run on every push and PR. These exist
# because of a specific class of bug: failures that are invisible at the moment
# they happen. An unchecked database write and a vendored file that quietly
# drifted both look exactly like working code.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      # Every .js file must at least parse. A syntax error here has twice
      # shipped a dashboard whose entire inline script was dead.
      - name: Syntax
        run: |
          set -e
          find . -name '*.js' -not -path './node_modules/*' -not -path './.git/*' \
            -print0 | xargs -0 -n1 node -c

      - name: Shopify connection and renewal
        run: node --test scripts/test-shopify-connection.js

      - name: Agent dashboard visibility and counts
        run: node --test scripts/test-agent-dashboard.js

      - name: Dashboard overview from chat
        run: node --test scripts/test-dashboard-overview.js

      - name: Chat presentation and generated media
        run: node --test scripts/test-chat-presentation.js

      - name: Requests preserved through onboarding
        run: node --test scripts/test-onboarding-handoff.js

      - name: Task continuity, verification and budgets
        run: node --test scripts/test-agent-execution.js scripts/test-agent-runners.js scripts/test-pg-task-queries.js

      - name: Agent context and current task state
        run: node --test scripts/test-agent-context-state.js scripts/test-confirmation-lifetime.js scripts/test-thread-size.js scripts/test-outbound-guard.js scripts/test-maps-fallback.js scripts/test-search-route.js scripts/test-facts-prose.js scripts/test-stuck-tools.js scripts/test-sleep-watch.js scripts/test-fx.js

      - name: Phone dashboard links
        run: node --test scripts/test-dashboard-links.js scripts/test-phone-registration.js scripts/test-phone-link-delivery.js scripts/test-dashboard-link-settings.js scripts/test-instance-navigation.js scripts/test-setup-personal-url.js

      - name: Bug reporting and consent
        run: node --test scripts/test-bug-reports.js

      - name: Flight times and booking changes
        run: node --test scripts/test-flights.js scripts/test-time-context.js scripts/test-bookings.js

      - name: Model routing and setup
        run: node --test scripts/test-model-routing.js scripts/test-model-settings-ui.js scripts/test-settings.js scripts/test-static-assets.js

      - name: Dashboard inline scripts parse
        run: node scripts/check-inline-scripts.js

      - name: Mac access setup and recovery
        run: node --test scripts/test-mac-access.js

      - name: No new unchecked database writes
        run: node scripts/check-unchecked-writes.js

      - name: Vendored copies have not drifted
        run: node scripts/check-vendored-identical.js

      - name: No count-gated reranking
        run: node scripts/check-rerank-callers.js
