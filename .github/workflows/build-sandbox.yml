name: Build Sandbox Image

on:
  push:
    branches: [main]
    paths:
      - 'sandbox-image/**'
  # A published image can be broken without its source changing: the 16 Aug
  # build emitted a zero-byte /entrypoint.sh from a 4032-byte source file and
  # every self-host install pulled a sandbox that could not start. Rebuilding
  # then needed a no-op commit to sandbox-image/ just to trip the path filter.
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v4

      # Intel runners, but self-hosters run Apple Silicon too; QEMU plus the
      # container driver is what lets one job publish both architectures.
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v5
        with:
          context: sandbox-image
          push: true
          platforms: linux/amd64,linux/arm64
          tags: ghcr.io/${{ github.repository_owner }}/closedhand-sandbox:latest
